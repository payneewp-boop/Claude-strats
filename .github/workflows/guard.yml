# GENERATED by cockpit/guard/sync-vendored.ps1 - edit the cockpit sources and re-run
# Guard: secret, personal-data and forbidden-path checks on every push and pull
# request. Vendored from cockpit/guard/templates/guard.yml by sync-vendored.ps1.
# Edit the cockpit source and re-sync; the generated header line is not
# preserved by hand edits.
#
# Bumping gitleaks: pick a newer 8.x release, copy its linux_x64 archive SHA-256
# from the release's checksums file into GITLEAKS_SHA256, and set GITLEAKS_VERSION.
# The job refuses an archive whose checksum differs.
name: guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      # Verified against gitleaks 8.30.1: `gitleaks git --redact --no-banner
      # --exit-code 1 --config <cfg> --log-opts="--all" --report-format json
      # --report-path <path> .`
      - name: Secrets in full history
        run: |
          set -eu
          REPORT="$RUNNER_TEMP/gitleaks-secrets.json"
          rm -f "$REPORT"
          rc=0
          gitleaks git --redact --no-banner --exit-code 1 \
            --config .guard/gitleaks-secrets.toml --log-opts="--all" \
            --report-format json --report-path "$REPORT" . || rc=$?
          if [ "$rc" -eq 1 ] && [ -s "$REPORT" ]; then
            python3 -I -c 'import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              items = json.load(fh) or []
          for f in items:
              c = (f.get("Commit") or "")[:12]
              tail = (" (" + c + ")") if c else ""
              print("%s:%s %s %s%s" % (f.get("File", ""), f.get("StartLine", 0), f.get("RuleID", ""), sys.argv[2], tail))' "$REPORT" block
          fi
          exit "$rc"

      # Personal data. Blocks in a public repository. In a private one the step
      # still shows as failed, but the job does not fail on it.
      - name: Personal data in full history
        continue-on-error: ${{ github.event.repository.private == true }}
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -eu
          REPORT="$RUNNER_TEMP/gitleaks-pii.json"
          rm -f "$REPORT"
          if [ "$IS_PRIVATE" = "true" ]; then SEV="warn"; else SEV="block"; fi
          rc=0
          gitleaks git --redact --no-banner --exit-code 1 \
            --config .guard/gitleaks-pii.toml --log-opts="--all" \
            --report-format json --report-path "$REPORT" . || rc=$?
          if [ "$rc" -eq 1 ] && [ -s "$REPORT" ]; then
            python3 -I -c 'import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              items = json.load(fh) or []
          for f in items:
              c = (f.get("Commit") or "")[:12]
              tail = (" (" + c + ")") if c else ""
              print("%s:%s %s %s%s" % (f.get("File", ""), f.get("StartLine", 0), f.get("RuleID", ""), sys.argv[2], tail))' "$REPORT" "$SEV"
          fi
          exit "$rc"

      # Paths added in the pushed range, matched against the forbidden list with
      # git's own ignore rules, in an empty repository so the repository's
      # .gitignore cannot hide a match. A negation line (!) is not a finding.
      - name: Forbidden paths added
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              BASE=$(git rev-parse "origin/${DEFAULT_BRANCH}") ;;
          esac
          git diff --name-only --diff-filter=A "$BASE" "$HEAD_SHA" > "$RUNNER_TEMP/added.txt"
          EMPTY="$RUNNER_TEMP/empty-repo"
          rm -rf "$EMPTY"
          git init -q "$EMPTY"
          cd "$EMPTY"
          FORBID="$GITHUB_WORKSPACE/.guard/forbidden-files.txt"
          rc=0
          git -c core.excludesFile="$FORBID" check-ignore --no-index -v --stdin \
            < "$RUNNER_TEMP/added.txt" > "$RUNNER_TEMP/hits.txt" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "forbidden-path check could not run (exit $rc)"; exit "$rc"; fi
          TAB=$(printf '\t')
          fail=0
          while IFS="$TAB" read -r meta path; do
            pattern=${meta##*:}
            case "$pattern" in '!'*) continue ;; esac
            echo "${path} forbidden-path block"
            fail=1
          done < "$RUNNER_TEMP/hits.txt"
          [ "$fail" -eq 0 ]
